[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcp-challenge-correction"
version = "1.0.0"
description = "Corrected analytical tools and follow-up checks for the 2022 DCP challenge"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Ruge Lin"}
]
dependencies = [
  "numpy>=1.24,<3"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9"
]

[project.urls]
Repository = "https://github.com/GoGoKo699/DCP-challenge"
Article = "https://doi.org/10.1103/PhysRevA.106.012430"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
